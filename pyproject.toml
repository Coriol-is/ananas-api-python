[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ananas-api-python"
version = "0.1.0"
description = "A modern Python client for the Ananas merchant API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Coriol-is" }]
keywords = ["ananas", "api", "ecommerce", "merchant", "serbia"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Documentation = "https://developer.ananas.rs/openapi/reference/overview/"
Repository = "https://github.com/Coriol-is/ananas-api-python"
Issues = "https://github.com/Coriol-is/ananas-api-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ananas_api"]

[tool.hatch.build]
exclude = ["/.uv-cache", "/.venv", "/dist"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
exclude = [".uv-cache", ".venv", "build", "dist"]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
